[package]
name = "llm-diff"
version = "0.3.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Diff LLM outputs: line, word and char diffs, unified patches, structural JSON diffs and RFC 6902 patches; optional content-addressed version store"
readme = "README.md"
repository = "https://gitlab.com/mattbusel/llm-diff"
documentation = "https://docs.rs/llm-diff"
keywords = ["llm", "diff", "versioning", "json", "prompt"]
categories = ["text-processing", "development-tools"]
include = ["src/**/*.rs", "benches/**/*.rs", "examples/**/*.rs", "Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE"]

[features]
default = ["store"]
## VersionStore (content-addressed history of outputs) and AuditLog. Turn it off
## with `default-features = false` for a diff-only build without uuid, chrono and sha2.
store = ["dep:uuid", "dep:chrono", "dep:sha2", "schemars?/chrono04"]
## Word diffs on Unicode word boundaries (CJK, punctuation): TextDiff::compute_unicode_words.
unicode = ["similar/unicode"]
## Apply unified diffs (patches) to text, via diffy: apply_patch.
patch = ["dep:diffy"]
## JSON Schema for the serialized types (schemars).
schemars = ["dep:schemars"]

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# version store and audit log (feature "store")
uuid = { version = "1", features = ["v4", "serde"], optional = true }
chrono = { version = "0.4", features = ["serde"], optional = true }
# word and char diffs, JSON array alignment, unified diff hunk grouping
similar = "3.2"
# line diffs and unified diffs (Histogram algorithm, git-style slider post-processing)
imara-diff = { version = "0.2", default-features = false }
# fast hashing for the word-overlap score (already a dependency of imara-diff)
foldhash = { version = "0.1", default-features = false, features = ["std"] }
# SHA-256 content addresses (feature "store")
sha2 = { version = "0.11", optional = true }
# applying patches (feature "patch")
diffy = { version = "0.5", optional = true }
# JSON Schema (feature "schemars")
schemars = { version = "1", optional = true }

# Random UUIDs need the browser's crypto API on wasm32-unknown-unknown.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
uuid = { version = "1", features = ["v4", "serde", "js"], optional = true }

[dev-dependencies]
criterion = { version = "0.5" }
proptest = "1"
# cross-checks and benchmarks against other diff crates
json-patch = "4"
diffy = "0.5"
dissimilar = "1"
llm_diff_011 = { package = "llm-diff", version = "=0.1.1" }

[[bench]]
name = "diff_bench"
harness = false
required-features = ["store"]

[[bench]]
name = "vs_alternatives"
harness = false

[[example]]
name = "quickstart"
required-features = ["store"]

[[example]]
name = "prompt_regression"

[[example]]
name = "structured_output"

[[example]]
name = "branch_merge"
required-features = ["patch", "store"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
